org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Lint in its own process: run inside the Gradle daemon it kept the analysed modules' classes.jar
# open on Windows, and the next build could not rewrite them ("the process cannot access the file").
android.experimental.runLintInProcess=false
